# .github/workflows/eval-on-push.yml
# Quick evaluation gate on every push and pull request.
# Runs a small subset of the eval bank so feedback is fast and cheap, then
# fails the build if accuracy falls below the gate. This is the "deployment
# eval gate" pattern: a regression that drops agent accuracy blocks the merge.

name: eval (quick gate)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # allows manual runs from the Actions tab

jobs:
  quick-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Fail fast with a clear message if the planner key is absent. Without it,
      # NLToSQLPlanner.__init__ raises SystemExit and the job dies in ~20s with a
      # cryptic exit 1 that looks like an eval failure but is really a setup gap.
      # Fail fast with a clear message if the planner key is absent. Without it,
      # NLToSQLPlanner.__init__ raises SystemExit and the job dies in ~20s with a
      # cryptic exit 1 that looks like an eval failure but is really a setup gap.
      - name: Verify required secret is present
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error title=Missing secret::GEMINI_API_KEY is not set for this workflow. The eval planner uses the Gemini provider and cannot run without it. Add it under Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "GEMINI_API_KEY is present."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Run quick eval (subset)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLANNER_PROVIDER: "gemini"      # gemini free tier has headroom for the full suite
          PLANNER_MIN_INTERVAL_SEC: "5"  # Groq free tier ~8K TPM (~1.4K tok/call) is the binding limit -> ~5 calls/min
          EVAL_SUBSET: "1"        # harness runs the tagged subset only
          EVAL_RUNS: "1"          # one run per case keeps the gate fast
        # Exit 2 = provider unavailable (402/429/5xx): an infrastructure outage,
        # not an accuracy regression -- warn instead of blocking the PR. Exit 1
        # (real regression) still fails the gate.
        run: |
          set +e
          python eval_harness.py
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning title=Provider unavailable::Eval inconclusive -- the LLM provider was unavailable for most runs (402/403-no-credits/429/5xx). This is NOT an accuracy regression. Fund/switch the provider, or run against a fallback provider (see README)."
            exit 0
          fi
          exit $code

      - name: Upload eval report
        if: always()              # keep the report even if the gate fails
        uses: actions/upload-artifact@v6
        with:
          name: eval-report-quick
          path: eval_runs/
