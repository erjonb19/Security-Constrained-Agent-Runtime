# .github/workflows/eval-nightly.yml
# Full evaluation suite on a nightly schedule. Runs all cases, multiple times
# each, for complete coverage and the real accuracy number. Does not run on
# push (that is the quick gate's job), so it never slows down development.

name: eval (full nightly)

on:
  schedule:
    - cron: "0 7 * * *"         # 07:00 UTC daily (~2-3am ET)
  workflow_dispatch:            # allows manual full runs any time

jobs:
  full-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Fail fast with a clear message if the planner key is absent. Without it,
      # NLToSQLPlanner.__init__ raises SystemExit and the job dies in ~20s with a
      # cryptic exit 1 that looks like an eval failure but is really a setup gap.
      - name: Verify required secret is present
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "::error title=Missing secret::XAI_API_KEY is not set for this workflow. The eval planner uses the xAI (Grok) provider and cannot run without it. Add it under Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "XAI_API_KEY is present."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Run full eval (all cases, 3 runs each)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PLANNER_PROVIDER: "xai"        # eval planner uses xAI (Grok); cerebras/groq stay selectable
          PLANNER_MIN_INTERVAL_SEC: "4"  # 105 calls: pace to stay under provider rate limits
          EVAL_RUNS: "3"
        # Exit 2 = provider unavailable (402/429/5xx). That is an infrastructure
        # outage, not an accuracy regression, so surface it as a warning instead
        # of failing the build. Exit 1 (real regression) still fails.
        run: |
          set +e
          python eval_harness.py --runs 3
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning title=Provider unavailable::Eval inconclusive -- the LLM provider returned 402/429/5xx for most runs. This is NOT an accuracy regression. Re-run when the provider recovers, or run against a fallback provider (see README)."
            exit 0
          fi
          exit $code

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-report-nightly
          path: eval_runs/
