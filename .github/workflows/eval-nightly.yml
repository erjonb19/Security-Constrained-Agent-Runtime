# .github/workflows/eval-nightly.yml
# Full evaluation suite on a nightly schedule. Runs all cases, multiple times
# each, for complete coverage and the real accuracy number. Does not run on
# push (that is the quick gate's job), so it never slows down development.

name: eval (full nightly)

on:
  schedule:
    - cron: "0 7 * * *"         # 07:00 UTC daily (~2-3am ET)
  workflow_dispatch:            # allows manual full runs any time

jobs:
  full-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Fail fast with a clear message if the planner key is absent. Without it,
      # NLToSQLPlanner.__init__ raises SystemExit and the job dies in ~20s with a
      # cryptic exit 1 that looks like an eval failure but is really a setup gap.
      - name: Verify required secret is present
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          if [ -z "$CEREBRAS_API_KEY" ]; then
            echo "::error title=Missing secret::CEREBRAS_API_KEY is not set for this workflow. The eval planner calls the Cerebras API and cannot run without it. Add it under Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "CEREBRAS_API_KEY is present."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Run full eval (all cases, 3 runs each)
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          EVAL_RUNS: "3"
        run: python eval_harness.py --runs 3

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-report-nightly
          path: eval_runs/
