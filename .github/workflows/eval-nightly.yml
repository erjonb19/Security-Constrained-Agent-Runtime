# .github/workflows/eval-nightly.yml
# Full evaluation suite on a nightly schedule. Runs all cases, multiple times
# each, for complete coverage and the real accuracy number. Does not run on
# push (that is the quick gate's job), so it never slows down development.

name: eval (full nightly)

on:
  schedule:
    - cron: "0 7 * * *"         # 07:00 UTC daily (~2-3am ET)
  workflow_dispatch:            # allows manual full runs any time

jobs:
  full-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Fail fast with a clear message if the planner key is absent. Without it,
      # NLToSQLPlanner.__init__ raises SystemExit and the job dies in ~20s with a
      # cryptic exit 1 that looks like an eval failure but is really a setup gap.
      - name: Verify required secret is present
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error title=Missing secret::GROQ_API_KEY is not set for this workflow. The eval planner uses the Groq provider (gpt-oss-120b) and cannot run without it. Add it under Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "GROQ_API_KEY is present."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Run full eval (all cases, 3 runs each)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PLANNER_PROVIDER: "groq"        # eval planner uses Groq (gpt-oss-120b); cerebras/xai stay selectable
          PLANNER_MIN_INTERVAL_SEC: "12"  # Groq free tier ~8K TPM is the binding limit -> ~5 calls/min (105 calls ~= 21 min)
          EVAL_RUNS: "3"
        # Exit 2 = provider unavailable (402/429/5xx). That is an infrastructure
        # outage, not an accuracy regression, so surface it as a warning instead
        # of failing the build. Exit 1 (real regression) still fails.
        run: |
          set +e
          python eval_harness.py --runs 3
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning title=Provider unavailable::Eval inconclusive -- the LLM provider was unavailable for most runs (402/403-no-credits/429/5xx). This is NOT an accuracy regression. Fund/switch the provider, or run against a fallback provider (see README)."
            exit 0
          fi
          exit $code

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-report-nightly
          path: eval_runs/

  # Second dataset: the 28-case FHIR clinical suite. Runs in parallel with the
  # hospital job. Its Gold DB is a derived artifact (gitignored), so this job
  # builds it from the Synthea source, cached so we don't refetch every night.
  fhir-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify required secret is present
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error title=Missing secret::GROQ_API_KEY is not set for this workflow. The eval planner uses the Groq provider (gpt-oss-120b) and cannot run without it."
            exit 1
          fi
          echo "GROQ_API_KEY is present."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      # Cache the Synthea download + built Gold so we don't refetch hundreds of
      # MB nightly. The key is tied to the build scripts, so it rebuilds only when
      # fetch/build logic changes.
      - name: Cache FHIR Gold
        id: fhir-cache
        uses: actions/cache@v4
        with:
          path: |
            data/synthea
            medallion/fhir_gold.duckdb
          key: fhir-gold-${{ hashFiles('fetch_synthea.py', 'build_fhir_gold.py') }}

      - name: Build FHIR Gold (on cache miss)
        if: steps.fhir-cache.outputs.cache-hit != 'true'
        run: |
          python fetch_synthea.py
          python build_fhir_gold.py

      - name: Run FHIR eval (28 cases, 3 runs each)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PLANNER_PROVIDER: "groq"           # Groq gpt-oss-120b; cerebras/xai selectable
          PLANNER_MIN_INTERVAL_SEC: "12"     # Groq free tier ~8K TPM is the binding limit
          EVAL_DATASET: "fhir"               # select the FHIR bank + fhir_gold.duckdb
          PLANNER_SCHEMA: "fhir"             # must be set in env (planner reads it at import)
          EVAL_RUNS: "3"
        # Exit 2 = provider unavailable -> warn, don't fail (see hospital job).
        run: |
          set +e
          python eval_harness.py --runs 3
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning title=Provider unavailable::FHIR eval inconclusive -- provider unavailable (402/403-no-credits/429/5xx). NOT an accuracy regression."
            exit 0
          fi
          exit $code

      - name: Upload FHIR eval report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-report-fhir-nightly
          path: eval_runs/
